<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Consulte os trabalhos de conclusão de curso publicados no catálogo do IFPB.">
  <title>Catálogo de TCCs | IFPB</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar"><a class="brand" href="./" aria-label="Catálogo de TCCs, início"><span class="brand-mark">T</span><span>Catálogo <b>de TCCs</b></span></a><span class="institution">RAD · IFPB</span></header>
  <main>
    <section class="hero"><p class="eyebrow">ACERVO ACADÊMICO</p><h1>Ideias que viraram<br><em>pesquisa.</em></h1><p class="intro">Explore os trabalhos de conclusão publicados pelos estudantes do curso.</p></section>
    <section class="catalog" aria-labelledby="catalog-heading">
      <div class="section-heading"><div><p class="eyebrow">BIBLIOTECA DIGITAL</p><h2 id="catalog-heading">Trabalhos publicados</h2></div><span id="result-count" class="result-count"></span></div>
      <form id="filters" class="filters">
        <label class="search-box"><span class="sr-only">Buscar por tema, autor ou orientador</span><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Busque por tema, autor ou orientador…"><button id="clear-search" type="button" aria-label="Limpar busca" hidden>×</button></label>
        <label><span class="sr-only">Ano</span><select id="year"><option value="">Todos os anos</option></select></label>
        <label><span class="sr-only">Curso</span><select id="course"><option value="">Todos os cursos</option></select></label>
        <label><span class="sr-only">Ordenar resultados</span><select id="ordering"><option value="-ano">Mais recentes</option><option value="ano">Mais antigos</option><option value="titulo">Título A–Z</option><option value="-titulo">Título Z–A</option></select></label>
      </form>
      <div id="notice" class="notice" role="status" aria-live="polite"></div>
      <div id="cards" class="cards"></div>
      <nav id="pagination" class="pagination" aria-label="Paginação"></nav>
    </section>
  </main>
  <dialog id="detail-dialog" aria-labelledby="detail-title"><button class="dialog-close" id="close-dialog" aria-label="Fechar">×</button><p class="eyebrow">DETALHE DO TRABALHO</p><div id="detail-content"></div></dialog>
  <footer><span>Catálogo de TCCs · RAD · IFPB</span><span>Conhecimento aberto, pesquisa acessível.</span></footer>
</body>
</html>
